<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập Admin - STEM IoT SaaS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <h1>STEM IoT Admin</h1>
        <p>Hệ thống Quản trị & Điều hành Bán hàng</p>
      </div>

      <div class="login-error" id="loginError"
        style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; text-align: center;">
        Tên đăng nhập hoặc mật khẩu không chính xác
      </div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="username">Tên tài khoản quản trị</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Nhập username" required
            autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu bảo mật</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required
            autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Đăng nhập hệ thống</span>
        </button>
      </form>

      <div class="login-hint">
        <p style="margin-bottom: 6px;">Tài khoản quản trị mặc định: <code>admin</code> · Mật khẩu: <code>admin123</code>
        </p>
        <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemoAccount()"
          style="font-size: 11.5px; padding: 4px 10px; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); color: #e2e8f0;">
          Điền thông tin quản trị
        </button>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <a href="../index.html"
          style="color: var(--cyan); text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6" />
          </svg>
          <span>Quay lại trang bán hàng</span>
        </a>
      </div>
    </div>
  </div>

  <script src="../store.js"></script>
  <script src="admin.js"></script>
  <script>
    if (getSession()) {
      window.location.href = 'dashboard.html';
    }

    function fillDemoAccount() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      showToast('Đã điền tài khoản quản trị', 'info');
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');

      if (login(username, password)) {
        errorEl.style.display = 'none';
        showToast('Đăng nhập thành công!', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 400);
      } else {
        errorEl.style.display = 'block';
        showToast('Sai thông tin đăng nhập', 'error');
      }
      return false;
    }
  </script>
</body>

</html>
