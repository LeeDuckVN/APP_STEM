<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - STEM IoT Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <div id="app"></div>

  <script src="../store.js"></script>
  <script src="admin.js"></script>
  <script>
    // ===== Khởi tạo: render layout TRƯỚC =====
    window.renderAllAdmin = function () {
      const contentEl = document.querySelector('.page-content');
      if (contentEl) {
        contentEl.innerHTML = buildDashboard();
      }
    };

    (function () {
      const session = requireAuth();
      if (!session) return;
      renderLayout('dashboard', 'Dashboard', buildDashboard(), `
        <button class="btn btn-sm btn-secondary" onclick="resetData()" title="Reset về dữ liệu gốc">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <span>Khôi phục mẫu</span>
        </button>
      `);
    })();

    function buildDashboard() {
      const products = getData('products', []);
      const orders = getData('orders', []);
      const users = getData('users', []);
      const categories = getData('categories', []);

      // ===== Thống kê từ dữ liệu thật =====
      const totalRevenue = orders
        .filter(o => o.payment === 'paid' && o.status !== 'cancelled')
        .reduce((s, o) => s + o.total, 0);
      const totalOrders = orders.length;
      const pendingOrders = orders.filter(o => o.status === 'pending').length;
      const totalProducts = products.length;
      const visibleProducts = products.filter(p => !p.hidden).length;
      const lowStock = products.filter(p => p.inventory > 0 && p.inventory <= 20).length;
      const outOfStock = products.filter(p => Number(p.inventory) === 0).length;
      const totalUsers = users.length;
      const totalSpent = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + o.total, 0);

      // ===== Hoạt động gần đây: từ đơn thật =====
      const recentOrders = [...orders].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
      const stockAlerts = products.filter(p => p.inventory > 0 && p.inventory <= 20).slice(0, 2);
      const activities = [
        ...recentOrders.map(o => ({
          type: 'order',
          text: `Đơn hàng <strong>${escapeHtml(o.id)}</strong> từ ${escapeHtml(o.customer)} — ${fmtVND(o.total)}`,
          time: o.createdAt
        })),
        ...stockAlerts.map(p => ({
          type: 'alert',
          text: `Cảnh báo: <strong>${escapeHtml(prodName(p))}</strong> chỉ còn ${p.inventory} sản phẩm`,
          time: Date.now() - 3600000
        }))
      ].sort((a, b) => b.time - a.time).slice(0, 6);

      // ===== Top sản phẩm bán chạy (từ sold thật) =====
      const topProducts = [...products].filter(p => (p.sold || 0) > 0).sort((a, b) => b.sold - a.sold).slice(0, 5);
      const maxSold = topProducts.length ? topProducts[0].sold : 1;
      return `
        <!-- STATS -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon green">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <div class="stat-info">
              <h3>${fmtVND(totalRevenue)}</h3>
              <p>Doanh thu (đã thu)</p>
              <div class="stat-trend up">Từ ${orders.filter(o => o.payment === 'paid').length} đơn đã thanh toán</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <div class="stat-info">
              <h3>${totalOrders}</h3>
              <p>Tổng số đơn hàng</p>
              <div class="stat-trend ${pendingOrders > 0 ? 'down' : 'up'}">${pendingOrders > 0 ? 'Có ' + pendingOrders + ' đơn chờ xử lý' : 'Không có đơn chờ'}</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon orange">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            </div>
            <div class="stat-info">
              <h3>${totalProducts}</h3>
              <p>Sản phẩm (${visibleProducts} đang hiện)</p>
              <div class="stat-trend ${lowStock + outOfStock > 0 ? 'down' : ''}">${outOfStock > 0 ? outOfStock + ' hết hàng' : ''}${outOfStock > 0 && lowStock > 0 ? ' · ' : ''}${lowStock > 0 ? lowStock + ' sắp hết' : (outOfStock === 0 ? 'Tồn kho dồi dào' : '')}</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="stat-info">
              <h3>${totalUsers}</h3>
              <p>Khách hàng hệ thống</p>
              <div class="stat-trend up">${users.filter(u => u.role === 'vip').length} khách VIP</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon red">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <div class="stat-info">
              <h3>${fmtVND(totalSpent)}</h3>
              <p>Tổng giá trị đơn khả dụng</p>
              <div class="stat-trend">Đồng bộ hai chiều</div>
            </div>
          </div>
        </div>

        <!-- RECENT ORDERS + ACTIVITY -->
        <div class="row">
          <div class="card">
            <div class="card-header">
              <div class="card-title">Đơn hàng mới nhất</div>
              <a class="btn btn-sm btn-secondary" href="orders.html">Xem tất cả</a>
            </div>
            <div class="card-body no-padding">
              ${recentOrders.length === 0 ? `
                <div class="empty-state">
                  <div class="icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                  </div>
                  <h3>Chưa có đơn hàng nào</h3>
                  <p>Khách đặt hàng trên cửa hàng → đơn hiện ở đây ngay lập tức</p>
                </div>
              ` : recentOrders.map(o => `
                <div class="cart-item">
                  <div class="cart-item-info">
                    <h4>${escapeHtml(o.id)} · ${escapeHtml(o.customer)}</h4>
                    <p>${timeAgo(o.createdAt)} · ${o.items.reduce((s, i) => s + i.qty, 0)} sản phẩm</p>
                  </div>
                  <div class="font-bold">${fmtVND(o.total)}</div>
                  <div>${badge(o.status, 'order')}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">Hoạt động thời gian thực</div>
            </div>
            <div class="card-body">
              <ul class="activity-list">
                ${activities.length === 0 ? '<li class="activity-item"><div class="activity-text"><p>Chưa có hoạt động nào</p></div></li>' : ''}
                ${activities.map(a => `
                  <li class="activity-item">
                    <div class="activity-icon ${a.type}">
                      ${a.type === 'order' ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>' : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'}
                    </div>
                    <div class="activity-text">
                      <p>${a.text}</p>
                      <small>${timeAgo(a.time)}</small>
                    </div>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>
        </div>
        <!-- TOP PRODUCTS + CATEGORY DISTRIBUTION -->
        <div class="row">
          <div class="card">
            <div class="card-header">
              <div class="card-title">Top sản phẩm bán chạy (từ đơn thật)</div>
              <a class="btn btn-sm btn-secondary" href="products.html">Quản lý</a>
            </div>
            <div class="card-body">
              ${topProducts.length === 0 ? '<p class="text-gray text-sm">Chưa có sản phẩm nào được bán</p>' : ''}
              ${topProducts.map(p => `
                <div style="margin-bottom: 16px;">
                  <div class="flex justify-between" style="margin-bottom: 4px;">
                    <span class="text-sm">${escapeHtml(prodName(p))}</span>
                    <span><strong>${p.sold}</strong> đã bán</span>
                  </div>
                  <div style="height: 8px; background: var(--light); border-radius: 4px; overflow: hidden;">
                    <div style="width: ${Math.max(4, Math.round(p.sold / maxSold * 100))}%; height: 100%; background: linear-gradient(to right, var(--primary), var(--primary-light));"></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">Phân bố danh mục</div>
            </div>
            <div class="card-body">
              ${categories.map(cat => {
        const cnt = products.filter(p => p.category === cat.id && !p.hidden).length;
        const pct = products.length ? Math.round(cnt / products.length * 100) : 0;
        return `
                  <div style="margin-bottom: 16px;">
                    <div class="flex justify-between" style="margin-bottom: 4px;">
                      <span>${cat.icon} ${escapeHtml(cat.label.vi)}</span>
                      <span><strong>${cnt}</strong> sản phẩm (${pct}%)</span>
                    </div>
                    <div style="height: 8px; background: var(--light); border-radius: 4px; overflow: hidden;">
                      <div style="width: ${pct}%; height: 100%; background: linear-gradient(to right, var(--primary), var(--primary-light));"></div>
                    </div>
                  </div>
                `;
      }).join('')}
            </div>
          </div>
        </div>

        <!-- STOCK ALERTS + QUICK LINKS -->
        <div class="row">
          <div class="card">
            <div class="card-header">
              <div class="card-title">Cảnh báo tồn kho</div>
              <a class="btn btn-sm btn-secondary" href="products.html">Xem sản phẩm</a>
            </div>
            <div class="card-body">
              ${outOfStock > 0 ? `
                <div style="padding: 12px; background: #fee2e2; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px;">
                  <div style="font-size: 24px;">⚠️</div>
                  <div>
                    <div style="font-weight: 600; color: #991b1b;">${outOfStock} sản phẩm hết hàng</div>
                    <div style="font-size: 12px; color: var(--gray);">Cần nhập hàng ngay</div>
                  </div>
                </div>
              ` : ''}
              ${lowStock > 0 ? `
                <div style="padding: 12px; background: #fef3c7; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px;">
                  <div style="font-size: 24px;">📉</div>
                  <div>
                    <div style="font-weight: 600; color: #92400e;">${lowStock} sản phẩm sắp hết</div>
                    <div style="font-size: 12px; color: var(--gray);">Tồn kho dưới 20</div>
                  </div>
                </div>
              ` : ''}
              ${outOfStock === 0 && lowStock === 0 ? `
                <div style="padding: 12px; background: #d1fae5; border-radius: 8px; display: flex; align-items: center; gap: 12px;">
                  <div style="font-size: 24px;">✅</div>
                  <div>
                    <div style="font-weight: 600; color: #065f46;">Tồn kho ổn định</div>
                    <div style="font-size: 12px; color: var(--gray);">Không có cảnh báo</div>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">Truy cập nhanh</div>
            </div>
            <div class="card-body">
              <div class="form-row">
                <a class="btn btn-primary" href="products.html">📦 Quản lý sản phẩm</a>
                <a class="btn btn-info" href="orders.html">🛒 Quản lý đơn hàng</a>
              </div>
              <div class="form-row" style="margin-top: 8px;">
                <a class="btn btn-success" href="users.html">👥 Quản lý khách hàng</a>
                <a class="btn btn-secondary" href="../index.html" target="_blank">🛍️ Xem cửa hàng</a>
              </div>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>

</html>
