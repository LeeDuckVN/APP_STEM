<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sản phẩm - STEM IoT Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <div id="app"></div>

  <!-- MODAL: Thêm / Sửa sản phẩm -->
  <div class="modal-backdrop" id="productFormModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="productFormTitle">Thêm sản phẩm</h3>
        <button class="modal-close" onclick="closeModal('productFormModal')">✕</button>
      </div>
      <div class="modal-body">
        <form id="productForm" onsubmit="saveProduct(event); return false">
          <input type="hidden" id="pfId" />
          <div class="form-row">
            <div class="form-group">
              <label for="pfName">Tên sản phẩm (tiếng Việt) *</label>
              <input type="text" class="form-control" id="pfName" required
                placeholder="VD: Arduino Proto Shield Rev3" />
            </div>
            <div class="form-group">
              <label for="pfSku">Mã SKU *</label>
              <input type="text" class="form-control" id="pfSku" required placeholder="VD: ST-BOARD-001" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="pfCategory">Danh mục *</label>
              <select class="form-control" id="pfCategory" required></select>
            </div>
            <div class="form-group">
              <label for="pfSub">Nhóm con</label>
              <select class="form-control" id="pfSub"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="pfPrice">Giá bán (đ) *</label>
              <input type="number" class="form-control" id="pfPrice" required min="0" step="1000"
                placeholder="150000" />
            </div>
            <div class="form-group">
              <label for="pfInventory">Tồn kho *</label>
              <input type="number" class="form-control" id="pfInventory" required min="0" step="1" placeholder="20" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="pfImageFile">Ảnh sản phẩm</label>
              <input type="file" class="form-control" id="pfImageFile" multiple
                accept="image/png,image/jpeg,image/webp,image/gif" />
              <small class="text-xs text-gray">Chọn nhiều ảnh. Ảnh sẽ được lưu trực tiếp trong MongoDB.</small>
              <div id="pfImagePreviews" class="product-image-previews" hidden></div>
              <input type="hidden" id="pfImage" />
            </div>
            <div class="form-group">
              <label for="pfBadge">Nhãn (badge)</label>
              <input type="text" class="form-control" id="pfBadge" placeholder="VD: Arduino / ESP32 / Mới" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="pfHidden">Hiển thị trên cửa hàng</label>
              <select class="form-control" id="pfHidden">
                <option value="false">Đang bán (hiện)</option>
                <option value="true">Ẩn khỏi cửa hàng</option>
              </select>
            </div>
            <div class="form-group">
              <label for="pfIsNew">Sản phẩm mới</label>
              <select class="form-control" id="pfIsNew">
                <option value="false">Không</option>
                <option value="true">Có — hiện ở mục "Hàng mới về"</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label for="pfDescription" style="margin-bottom: 0;">Mô tả (tiếng Việt)</label>
              <button type="button" class="btn btn-xs" id="btnQuickTranslate" onclick="previewAutoTranslate()"
                style="display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid #0284c7; color: #0284c7; background: #f0f9ff; transition: all .2s ease;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10" />
                  <line x1="2" y1="12" x2="22" y2="12" />
                  <path
                    d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                </svg>
                <span>⚡ Dịch tự động EN & JA</span>
              </button>
            </div>
            <textarea class="form-control" id="pfDescription" placeholder="Mô tả ngắn về sản phẩm..."></textarea>
          </div>

          <!-- Khối bản dịch đa ngôn ngữ tự động (UI/UX Pro Max) -->
          <details class="translation-preview-box" id="translationDetails"
            style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 14px; margin-top: 12px;">
            <summary
              style="font-weight: 700; font-size: 13px; color: #1e293b; cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
              <span style="display: inline-flex; align-items: center; gap: 6px;">
                <span>🌍</span>
                <span>Bản dịch Đa Ngôn Ngữ (Tiếng Anh & Tiếng Nhật)</span>
              </span>
              <span class="badge badge-info" id="transStatusBadge" style="font-size: 11px;">Tự động dịch khi Lưu</span>
            </summary>
            <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="pfNameEn" class="text-xs font-bold text-gray"
                  style="display: block; margin-bottom: 4px;">🇬🇧 Tên tiếng Anh (EN)</label>
                <input type="text" class="form-control text-sm" id="pfNameEn"
                  placeholder="Tự động dịch sang tiếng Anh..." />
              </div>
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="pfNameJa" class="text-xs font-bold text-gray"
                  style="display: block; margin-bottom: 4px;">🇯🇵 Tên tiếng Nhật (JA)</label>
                <input type="text" class="form-control text-sm" id="pfNameJa"
                  placeholder="Tự động dịch sang tiếng Nhật..." />
              </div>
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="pfBadgeEn" class="text-xs font-bold text-gray"
                  style="display: block; margin-bottom: 4px;">🇬🇧 Nhãn tiếng Anh (Badge EN)</label>
                <input type="text" class="form-control text-sm" id="pfBadgeEn" placeholder="VD: Best Seller" />
              </div>
              <div class="form-group" style="margin-bottom: 8px;">
                <label for="pfBadgeJa" class="text-xs font-bold text-gray"
                  style="display: block; margin-bottom: 4px;">🇯🇵 Nhãn tiếng Nhật (Badge JA)</label>
                <input type="text" class="form-control text-sm" id="pfBadgeJa" placeholder="VD: おすすめ" />
              </div>
              <div class="form-group" style="grid-column: 1 / -1; margin-bottom: 8px;">
                <label for="pfDescEn" class="text-xs font-bold text-gray"
                  style="display: block; margin-bottom: 4px;">🇬🇧 Mô tả tiếng Anh (EN)</label>
                <textarea class="form-control text-sm" id="pfDescEn" rows="2"
                  placeholder="English description..."></textarea>
              </div>
              <div class="form-group" style="grid-column: 1 / -1; margin-bottom: 0;">
                <label for="pfDescJa" class="text-xs font-bold text-gray"
                  style="display: block; margin-bottom: 4px;">🇯🇵 Mô tả tiếng Nhật (JA)</label>
                <textarea class="form-control text-sm" id="pfDescJa" rows="2"
                  placeholder="Japanese description..."></textarea>
              </div>
            </div>
          </details>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('productFormModal')">Hủy</button>
        <button class="btn btn-primary" onclick="document.getElementById('productForm').requestSubmit()">💾 Lưu</button>
      </div>
    </div>
  </div>
  <!-- MODAL: Xem chi tiết sản phẩm -->
  <div class="modal-backdrop" id="productModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Chi tiết sản phẩm</h3>
        <button class="modal-close" onclick="closeModal('productModal')">✕</button>
      </div>
      <div class="modal-body" id="productContent"></div>
      <div class="modal-footer" id="productFooter">
        <button class="btn btn-secondary" onclick="closeModal('productModal')">Đóng</button>
      </div>
    </div>
  </div>

  <script src="../store.js"></script>
  <script src="admin.js"></script>
  <script>
    let allProducts = [];
    let categories = [];
    let filterState = { search: '', category: '', sub: '', stock: '' };
    let pendingProductImages = [];

    // ===== Khởi tạo: render layout TRƯỚC, gắn sự kiện SAU =====
    (function () {
      const session = requireAuth();
      if (!session) return;

      categories = getData('categories', []);
      renderLayout('products', 'Quản lý sản phẩm', buildPage(), `
        <button class="btn btn-sm btn-primary" onclick="openAddProduct()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Thêm sản phẩm</span>
        </button>
        <button class="btn btn-sm btn-secondary" id="btnTranslateCatalog" onclick="autoTranslateAllProductsCatalog()" title="Dịch tự động EN & JA và lưu trực tiếp vào MongoDB Atlas">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="btnTranslateCatalogText">Dịch catalog sang EN/JA</span>
        </button>
      `);

      document.getElementById('pfImageFile').addEventListener('change', handleImageFile);

      document.getElementById('searchProduct').addEventListener('input', (e) => { filterState.search = e.target.value; renderTable(); });
      document.getElementById('filterCategory').addEventListener('change', (e) => { filterState.category = e.target.value; filterState.sub = ''; renderSubOptions(); renderTable(); });
      document.getElementById('filterSub').addEventListener('change', (e) => { filterState.sub = e.target.value; renderTable(); });
      document.getElementById('filterStock').addEventListener('change', (e) => { filterState.stock = e.target.value; renderTable(); });

      renderAllAdmin = function () {
        allProducts = getData('products', []);
        renderStats();
        renderTable();
      };
      renderAllAdmin();
      loadStoreFromMongo().then(() => renderAllAdmin()).catch(() => { });
    })();

    function readImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Không đọc được ảnh'));
        reader.readAsDataURL(file);
      });
    }

    function renderImagePreviews() {
      const container = document.getElementById('pfImagePreviews');
      if (!container) return;
      container.innerHTML = pendingProductImages.map((image, index) => {
        const previewImage = /^data:image\//i.test(image) ? image : getStoreImageUrl(image, true);
        return `
        <div class="product-image-preview-item">
          <img src="${previewImage}" alt="Ảnh sản phẩm ${index + 1}" onerror="this.src='../assets/stem-iot-banner.png'" />
          <button type="button" class="product-image-remove" data-image-index="${index}" title="Xóa ảnh">×</button>
        </div>
      `;
      }).join('');
      container.hidden = pendingProductImages.length === 0;
      container.querySelectorAll('[data-image-index]').forEach(button => {
        button.addEventListener('click', () => {
          pendingProductImages.splice(Number(button.dataset.imageIndex), 1);
          renderImagePreviews();
        });
      });
    }

    async function handleImageFile(event) {
      const files = [...event.target.files];
      if (!files.length) return;
      const oversized = files.find(file => file.size > 8 * 1024 * 1024);
      if (oversized) {
        event.target.value = '';
        showToast('Mỗi ảnh tối đa 8MB', 'error');
        return;
      }
      try {
        const images = await Promise.all(files.map(readImageFile));
        pendingProductImages = [...pendingProductImages, ...images];
        document.getElementById('pfImage').value = pendingProductImages[0] || '';
        renderImagePreviews();
      } catch (error) {
        showToast(error.message, 'error');
      }
      event.target.value = '';
    }

    function renderStats() {
      const total = allProducts.length;
      const visible = allProducts.filter(p => !p.hidden).length;
      const outOfStock = allProducts.filter(p => Number(p.inventory) === 0).length;
      const lowStock = allProducts.filter(p => p.inventory > 0 && p.inventory <= 20).length;
      const totalValue = allProducts.reduce((s, p) => s + p.price * p.inventory, 0);

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statVisible').textContent = visible;
      document.getElementById('statOutOfStock').textContent = outOfStock;
      document.getElementById('statLowStock').textContent = lowStock;
      document.getElementById('statTotalValue').textContent = fmtVND(totalValue);
    }

    function renderSubOptions() {
      const cat = categories.find(c => c.id === filterState.category);
      const subs = cat ? cat.subs : [];
      const sel = document.getElementById('filterSub');
      sel.innerHTML = '<option value="">Tất cả nhóm con</option>' + subs.map(s => `<option value="${s.id}">${escapeHtml(s.label.vi)}</option>`).join('');
      sel.value = filterState.sub || '';
    }
    function renderTable() {
      const f = filterState;
      const filtered = allProducts.filter(p => {
        if (f.search && !prodName(p).toLowerCase().includes(f.search.toLowerCase()) && !String(p.sku).toLowerCase().includes(f.search.toLowerCase())) return false;
        if (f.category && p.category !== f.category) return false;
        if (f.sub && p.sub !== f.sub) return false;
        if (f.stock === 'inStock' && !(p.inventory > 0)) return false;
        if (f.stock === 'lowStock' && !(p.inventory > 0 && p.inventory <= 20)) return false;
        if (f.stock === 'outOfStock' && !(Number(p.inventory) === 0)) return false;
        return true;
      }).sort((a, b) => (b.sold || 0) - (a.sold || 0));

      const countEl = document.getElementById('productCount');
      if (countEl) countEl.textContent = filtered.length;

      const tbody = document.getElementById('productTbody');
      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="empty-state">
                <div class="icon">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                </div>
                <h3>Không có sản phẩm nào</h3>
                <p>Thử thay đổi bộ lọc hoặc thêm sản phẩm mới</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const cat = categories.find(c => c.id === p.category);
        const subLabel = cat && cat.subs.find(s => s.id === p.sub);
        const hasEn = typeof p.name === 'object' && p.name?.en && typeof p.description === 'object' && p.description?.en;
        const hasJa = typeof p.name === 'object' && p.name?.ja && typeof p.description === 'object' && p.description?.ja;
        const langBadge = (hasEn && hasJa)
          ? '<span class="badge badge-info" style="font-size: 10px; padding: 2px 7px; margin-left: 6px; font-weight: 700; background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;" title="Đã lưu bản dịch VI, EN, JA trên MongoDB Atlas">🌐 VI · EN · JA</span>'
          : '<span class="badge badge-warning" style="font-size: 10px; padding: 2px 7px; margin-left: 6px; font-weight: 700;" title="Chưa có đủ bản dịch">🌐 Chỉ có VI</span>';
        return `
          <tr>
            <td>
              <div class="product-cell">
                <img class="product-img" src="${getProductImageUrl(p, true)}" alt="${escapeHtml(prodName(p))}" onerror="this.src='../assets/stem-iot-banner.png'" />
                <div class="info">
                  <h4>${escapeHtml(prodName(p))} ${p.hidden ? '<span class="badge badge-gray"><span class="badge-dot"></span>Ẩn</span>' : ''} ${langBadge}</h4>
                  <span>${escapeHtml(p.sku)}</span>
                </div>
              </div>
            </td>
            <td>${cat ? escapeHtml(cat.label.vi) : '—'}${subLabel ? '<br><small class="text-xs text-gray">' + escapeHtml(subLabel.label.vi) + '</small>' : ''}</td>
            <td><strong class="${p.inventory === 0 ? 'text-danger' : (p.inventory <= 20 ? 'text-warning' : '')}">${p.inventory}</strong></td>
            <td>${p.sold || 0}</td>
            <td><strong>${fmtVND(p.price)}</strong></td>
            <td>${p.hidden ? '<span class="badge badge-gray"><span class="badge-dot"></span>Đang ẩn</span>' : '<span class="badge badge-success"><span class="badge-dot"></span>Đang bán</span>'}</td>
            <td>
              <div class="action-buttons">
                <button class="action-btn view" title="Xem chi tiết" onclick="viewProduct('${p.id}')">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button class="action-btn edit" title="Sửa" onclick="openEditProduct('${p.id}')">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="action-btn delete" title="Xóa" onclick="deleteProduct('${p.id}')">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }
    // ===== THÊM / SỬA SẢN PHẨM =====
    function openAddProduct() {
      document.getElementById('productFormTitle').textContent = 'Thêm sản phẩm';
      document.getElementById('productForm').reset();
      document.getElementById('pfId').value = '';
      document.getElementById('pfImage').value = '';
      pendingProductImages = [];
      renderImagePreviews();
      ['pfNameEn', 'pfNameJa', 'pfBadgeEn', 'pfBadgeJa', 'pfDescEn', 'pfDescJa'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      const details = document.getElementById('translationDetails');
      if (details) details.open = false;
      const stBadge = document.getElementById('transStatusBadge');
      if (stBadge) {
        stBadge.textContent = 'Tự động dịch khi Lưu';
        stBadge.className = 'badge badge-info';
      }
      fillCategoryOptions('', '');
      openModal('productFormModal');
    }

    function openEditProduct(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      document.getElementById('productFormTitle').textContent = 'Sửa sản phẩm';
      fillCategoryOptions(p.category, p.sub || '');
      document.getElementById('pfId').value = p.id;
      document.getElementById('pfName').value = prodName(p);
      document.getElementById('pfSku').value = p.sku;
      document.getElementById('pfPrice').value = p.price;
      document.getElementById('pfInventory').value = p.inventory;
      pendingProductImages = Array.isArray(p.images) && p.images.length
        ? [...p.images]
        : (p.imageData ? [p.imageData] : []);
      document.getElementById('pfImage').value = pendingProductImages[0] || p.image || '';
      renderImagePreviews();
      document.getElementById('pfBadge').value = typeof p.badge === 'string' ? p.badge : (p.badge ? p.badge.vi : '') || '';
      document.getElementById('pfHidden').value = p.hidden ? 'true' : 'false';
      document.getElementById('pfIsNew').value = p.isNew ? 'true' : 'false';
      document.getElementById('pfDescription').value = prodDesc(p);

      // Điền các trường tiếng Anh / tiếng Nhật nếu có
      const enName = typeof p.name === 'object' && p.name ? (p.name.en || '') : '';
      const jaName = typeof p.name === 'object' && p.name ? (p.name.ja || '') : '';
      const enBadge = typeof p.badge === 'object' && p.badge ? (p.badge.en || '') : '';
      const jaBadge = typeof p.badge === 'object' && p.badge ? (p.badge.ja || '') : '';
      const enDesc = typeof p.description === 'object' && p.description ? (p.description.en || '') : '';
      const jaDesc = typeof p.description === 'object' && p.description ? (p.description.ja || '') : '';

      document.getElementById('pfNameEn').value = enName;
      document.getElementById('pfNameJa').value = jaName;
      document.getElementById('pfBadgeEn').value = enBadge;
      document.getElementById('pfBadgeJa').value = jaBadge;
      document.getElementById('pfDescEn').value = enDesc;
      document.getElementById('pfDescJa').value = jaDesc;

      const details = document.getElementById('translationDetails');
      const stBadge = document.getElementById('transStatusBadge');
      const hasTranslation = !!(enName && jaName && enDesc && jaDesc);
      if (hasTranslation) {
        if (details) details.open = true;
        if (stBadge) {
          stBadge.textContent = '✓ Đã có bản dịch EN/JA';
          stBadge.className = 'badge badge-success';
        }
      } else {
        if (details) details.open = false;
        if (stBadge) {
          stBadge.textContent = 'Tự động dịch khi Lưu';
          stBadge.className = 'badge badge-info';
        }
      }

      openModal('productFormModal');
    }

    async function previewAutoTranslate() {
      const name = document.getElementById('pfName').value.trim();
      const badgeText = document.getElementById('pfBadge').value.trim();
      const description = document.getElementById('pfDescription').value.trim();

      if (!name && !badgeText && !description) {
        showToast('Vui lòng nhập Tên sản phẩm trước khi dịch', 'warning');
        return;
      }

      const btn = document.getElementById('btnQuickTranslate');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner" style="display:inline-block;width:12px;height:12px;border:2px solid #0284c7;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;"></span>Đang dịch...`;

      try {
        const res = await autoTranslateProductFields({
          name,
          badge: badgeText,
          description
        });

        if (res.name) {
          document.getElementById('pfNameEn').value = res.name.en || name;
          document.getElementById('pfNameJa').value = res.name.ja || name;
        }
        if (res.badge) {
          document.getElementById('pfBadgeEn').value = res.badge.en || badgeText;
          document.getElementById('pfBadgeJa').value = res.badge.ja || badgeText;
        }
        if (res.description) {
          document.getElementById('pfDescEn').value = res.description.en || description;
          document.getElementById('pfDescJa').value = res.description.ja || description;
        }

        const details = document.getElementById('translationDetails');
        if (details) details.open = true;

        const stBadge = document.getElementById('transStatusBadge');
        if (stBadge) {
          stBadge.textContent = '✓ Đã dịch bằng Google';
          stBadge.className = 'badge badge-success';
        }

        showToast('Đã dịch tự động sang Tiếng Anh và Tiếng Nhật thành công!', 'success');
      } catch (err) {
        showToast('Lỗi khi gọi Google Dịch: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = origHtml;
      }
    }

    function fillCategoryOptions(categoryId, subId) {
      const catSel = document.getElementById('pfCategory');
      catSel.innerHTML = categories.map(c => `<option value="${c.id}">${escapeHtml(c.icon)} ${escapeHtml(c.label.vi)}</option>`).join('');
      catSel.value = categoryId || (categories[0] ? categories[0].id : '');
      fillSubOptions(subId);
      catSel.onchange = () => fillSubOptions('');
    }

    function fillSubOptions(subId) {
      const cat = categories.find(c => c.id === document.getElementById('pfCategory').value);
      const subSel = document.getElementById('pfSub');
      const subs = cat ? cat.subs : [];
      subSel.innerHTML = subs.map(s => `<option value="${s.id}">${escapeHtml(s.label.vi)}</option>`).join('');
      subSel.value = subId || (subs[0] ? subs[0].id : '');
    }

    async function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('pfId').value;
      const name = document.getElementById('pfName').value.trim();
      const sku = document.getElementById('pfSku').value.trim();
      const category = document.getElementById('pfCategory').value;
      const sub = document.getElementById('pfSub').value;
      const price = Number(document.getElementById('pfPrice').value);
      const inventory = Number(document.getElementById('pfInventory').value);
      const rawImage = document.getElementById('pfImage').value.trim();
      const images = pendingProductImages.length
        ? [...pendingProductImages]
        : (rawImage.startsWith('data:image/') ? [rawImage] : []);
      const imageData = images.find(image => image.startsWith('data:image/')) || '';
      const image = imageData ? 'assets/stem-iot-banner.png' : (rawImage ? rawImage.replace(/^(\.\.\/|\.\/)+/, '') : 'assets/stem-iot-banner.png');
      const badgeText = document.getElementById('pfBadge').value.trim();
      const hidden = document.getElementById('pfHidden').value === 'true';
      const isNew = document.getElementById('pfIsNew').value === 'true';
      const description = document.getElementById('pfDescription').value.trim();

      if (!name || !sku || !category || isNaN(price)) {
        showToast('Vui lòng nhập đủ thông tin bắt buộc', 'error');
        return false;
      }
      const dup = allProducts.find(p => String(p.sku).toLowerCase() === sku.toLowerCase() && p.id !== id);
      if (dup) {
        showToast('Mã SKU đã tồn tại: ' + prodName(dup), 'error');
        return false;
      }

      // Tự động dịch sang tiếng Anh và tiếng Nhật bằng Google Translate nếu chưa có
      let nameEn = document.getElementById('pfNameEn')?.value.trim();
      let nameJa = document.getElementById('pfNameJa')?.value.trim();
      let badgeEn = document.getElementById('pfBadgeEn')?.value.trim();
      let badgeJa = document.getElementById('pfBadgeJa')?.value.trim();
      let descEn = document.getElementById('pfDescEn')?.value.trim();
      let descJa = document.getElementById('pfDescJa')?.value.trim();

      if (!nameEn || !nameJa || nameEn === name || nameJa === name) {
        showToast('Đang tự động dịch sang Tiếng Anh & Tiếng Nhật...', 'info', 2000);
        try {
          const trans = await autoTranslateProductFields({
            name,
            badge: badgeText,
            description
          });
          nameEn = nameEn || trans.name?.en || name;
          nameJa = nameJa || trans.name?.ja || name;
          badgeEn = badgeEn || trans.badge?.en || badgeText;
          badgeJa = badgeJa || trans.badge?.ja || badgeText;
          descEn = descEn || trans.description?.en || description;
          descJa = descJa || trans.description?.ja || description;
        } catch (err) {
          console.warn('Auto translate warning:', err);
          nameEn = nameEn || name;
          nameJa = nameJa || name;
        }
      }

      const data = {
        name: { vi: name, en: nameEn || name, ja: nameJa || name },
        sku, category, sub, price, inventory, image, imageData, images, hidden, isNew,
        badge: { vi: badgeText, en: badgeEn || badgeText, ja: badgeJa || badgeText },
        description: { vi: description, en: descEn || description, ja: descJa || description }
      };

      if (id) {
        const idx = allProducts.findIndex(p => p.id === id);
        if (idx >= 0) allProducts[idx] = { ...allProducts[idx], ...data };
        showToast('Đã cập nhật sản phẩm — Đã đồng bộ bản dịch EN/JA', 'success');
      } else {
        allProducts.push({ id: genStoreId('p'), ...data, imagePosition: '50% 50%', unit: { vi: 'Cái', en: 'pc', ja: '個' }, sold: 0 });
        showToast('Đã thêm sản phẩm mới — Tự động dịch EN/JA thành công', 'success');
      }

      setData('products', allProducts);
      try {
        await saveStoreToMongo();
      } catch (error) {
        showToast('Đã lưu trên trình duyệt nhưng chưa lưu được MongoDB', 'warning');
        return false;
      }
      closeModal('productFormModal');
      renderAllAdmin();
      return false;
    }

    // ===== DỊCH TỰ ĐỘNG TOÀN BỘ CATALOG SẢN PHẨM & LƯU VÀO MONGODB =====
    async function autoTranslateAllProductsCatalog() {
      if (!allProducts || allProducts.length === 0) {
        showToast('Không có sản phẩm nào trong catalog', 'info');
        return;
      }

      const needTranslation = allProducts.filter(p => {
        const enName = typeof p.name === 'object' && p.name?.en ? String(p.name.en).trim() : '';
        const jaName = typeof p.name === 'object' && p.name?.ja ? String(p.name.ja).trim() : '';
        const enDesc = typeof p.description === 'object' && p.description?.en ? String(p.description.en).trim() : '';
        const jaDesc = typeof p.description === 'object' && p.description?.ja ? String(p.description.ja).trim() : '';
        return !enName || !jaName || !enDesc || !jaDesc;
      });

      let force = false;
      if (needTranslation.length === 0) {
        const reTranslate = confirmAction(`Toàn bộ ${allProducts.length}/${allProducts.length} sản phẩm trong catalog đều ĐÃ CÓ đầy đủ bản dịch tiếng Anh (EN) và tiếng Nhật (JA) trên MongoDB Atlas!\n\nBạn có muốn dịch lại toàn bộ bằng Google Translate và cập nhật lại không?`);
        if (!reTranslate) {
          showToast(`✓ Tất cả ${allProducts.length} sản phẩm đều đã có đầy đủ bản dịch EN & JA chuẩn xác trên MongoDB Atlas!`, 'success', 4000);
          return;
        }
        force = true;
      } else {
        if (!confirmAction(`Tìm thấy ${needTranslation.length}/${allProducts.length} sản phẩm chưa có đầy đủ bản dịch EN/JA. Bạn có muốn tự động dịch toàn bộ và lưu ngay vào MongoDB Atlas không?`)) {
          return;
        }
      }

      const btn = document.getElementById('btnTranslateCatalog');
      const origHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner" style="display:inline-block;width:13px;height:13px;border:2px solid #0284c7;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;"></span><span>Đang dịch & lưu MongoDB...</span>`;
      }
      showToast(force ? `Đang dịch lại toàn bộ ${allProducts.length} sản phẩm sang EN & JA...` : `Đang tự động dịch ${needTranslation.length} sản phẩm và lưu trực tiếp vào MongoDB...`, 'info', 4000);

      try {
        // Cách 1: Gọi endpoint chuyên biệt trên máy chủ backend (xử lý song song, lưu trực tiếp MongoDB Atlas)
        const res = await fetch(`${getApiBaseUrl()}/api/products/translate-all`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ force })
        });

        if (res.ok) {
          const json = await res.json();
          if (json.ok && Array.isArray(json.products)) {
            allProducts = json.products;
            setData('products', allProducts);
            showToast(`✓ Đã tự động dịch và lưu toàn bộ ${json.count || allProducts.length} sản phẩm vào MongoDB Atlas thành công!`, 'success', 5000);
            renderAllAdmin();
            return;
          }
        }
        throw new Error('Chuyển sang fallback client');
      } catch (err) {
        // Cách 2: Fallback dịch song song từ client và gọi saveStoreToMongo()
        try {
          const targetList = force ? allProducts : needTranslation;
          await Promise.all(targetList.map(async (p) => {
            const vnName = prodName(p);
            const vnBadge = typeof p.badge === 'string' ? p.badge : (p.badge?.vi || '');
            const vnDesc = prodDesc(p);
            try {
              const trans = await autoTranslateProductFields({
                name: vnName,
                badge: vnBadge,
                description: vnDesc
              });
              p.name = { vi: vnName, en: trans.name?.en || vnName, ja: trans.name?.ja || vnName };
              p.badge = { vi: vnBadge, en: trans.badge?.en || vnBadge, ja: trans.badge?.ja || vnBadge };
              p.description = { vi: vnDesc, en: trans.description?.en || vnDesc, ja: trans.description?.ja || vnDesc };
            } catch (e) {
              console.warn('Translate item failed:', p.id, e);
            }
          }));

          setData('products', allProducts);
          await saveStoreToMongo();
          showToast(`✓ Đã dịch và lưu toàn bộ ${targetList.length} sản phẩm vào MongoDB Atlas thành công!`, 'success', 5000);
        } catch (saveErr) {
          showToast('Lỗi khi lưu vào MongoDB: ' + saveErr.message, 'error', 5000);
        }
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }
        renderAllAdmin();
      }
    }

    // ===== XÓA =====
    function deleteProduct(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      if (!confirmAction(`Xóa sản phẩm "${prodName(p)}"? Khách sẽ không còn thấy sản phẩm này.`)) return;
      allProducts = allProducts.filter(x => x.id !== id);
      setData('products', allProducts);
      showToast('Đã xóa sản phẩm', 'success');
      renderAllAdmin();
    }
    // ===== XEM CHI TIẾT =====
    function viewProduct(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      const cat = categories.find(c => c.id === p.category);
      document.getElementById('productContent').innerHTML = `
        <div class="product-cell" style="margin-bottom: 16px;">
          <img class="product-img" src="${getProductImageUrl(p, true)}" alt="${escapeHtml(prodName(p))}" onerror="this.src='../assets/stem-iot-banner.png'" style="width: 80px; height: 80px;" />
          <div class="info">
            <h4 style="font-size: 16px;">${escapeHtml(prodName(p))}</h4>
            <span>SKU: ${escapeHtml(p.sku)} · ${cat ? escapeHtml(cat.label.vi) : '—'}</span>
          </div>
        </div>
        <div class="form-row">
          <div><span class="text-xs text-gray">Giá bán</span><div class="font-bold text-success">${fmtVND(p.price)}</div></div>
          <div><span class="text-xs text-gray">Tồn kho</span><div class="font-bold ${p.inventory === 0 ? 'text-danger' : ''}">${p.inventory}</div></div>
        </div>
        <div class="form-row" style="margin-top: 12px;">
          <div><span class="text-xs text-gray">Đã bán</span><div class="font-bold">${p.sold || 0}</div></div>
          <div><span class="text-xs text-gray">Trạng thái</span><div>${p.hidden ? '<span class="badge badge-gray">Đang ẩn</span>' : '<span class="badge badge-success">Đang bán</span>'}</div></div>
        </div>
        ${prodDesc(p) ? `<p style="margin-top: 16px;" class="text-sm">${escapeHtml(prodDesc(p))}</p>` : ''}
      `;
      document.getElementById('productFooter').innerHTML = `
        <button class="btn btn-secondary" onclick="closeModal('productModal')">Đóng</button>
        <button class="btn btn-primary" onclick="closeModal('productModal'); openEditProduct('${p.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Sửa sản phẩm</span>
        </button>
      `;
      openModal('productModal');
    }
