<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Báo giá nhanh - STEM IoT Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <div id="app"></div>

  <!-- MODAL: Chi tiết & Xử lý yêu cầu báo giá -->
  <div class="modal-backdrop" id="quoteDetailModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Xử lý yêu cầu báo giá</h3>
        <button class="modal-close" onclick="closeModal('quoteDetailModal')">✕</button>
      </div>
      <div class="modal-body" id="quoteDetailContent"></div>
      <div class="modal-footer" id="quoteDetailFooter"></div>
    </div>
  </div>

  <!-- MODAL: Tạo yêu cầu báo giá mới -->
  <div class="modal-backdrop" id="createQuoteModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Ghi nhận yêu cầu báo giá mới</h3>
        <button class="modal-close" onclick="closeModal('createQuoteModal')">✕</button>
      </div>
      <div class="modal-body">
        <form id="createQuoteForm" onsubmit="return handleAdminCreateQuote(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="cqCustomer">Họ tên khách hàng / Đơn vị yêu cầu *</label>
              <input type="text" class="form-control" id="cqCustomer" required
                placeholder="Nhập họ tên khách hàng hoặc tên công ty/trường học..." />
            </div>
            <div class="form-group">
              <label for="cqPhone">Số điện thoại / Zalo *</label>
              <input type="tel" class="form-control" id="cqPhone" required
                placeholder="Nhập số điện thoại liên hệ..." />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cqEmail">Email liên hệ (nếu có)</label>
              <input type="email" class="form-control" id="cqEmail" placeholder="Nhập địa chỉ email..." />
            </div>
            <div class="form-group">
              <label for="cqStatus">Trạng thái ban đầu</label>
              <select class="form-control" id="cqStatus">
                <option value="pending">Chờ báo giá</option>
                <option value="contacted">Đã liên hệ</option>
                <option value="quoted">Đã báo giá</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="cqContent">Danh sách linh kiện, số lượng & yêu cầu dự án *</label>
            <textarea class="form-control" id="cqContent" required rows="4"
              placeholder="Nhập tên/mã linh kiện, số lượng, quy cách đóng gói hoặc yêu cầu kỹ thuật..."></textarea>
          </div>
          <div class="form-group">
            <label for="cqNotes">Ghi chú nội bộ</label>
            <input type="text" class="form-control" id="cqNotes"
              placeholder="Ghi chú về tiến độ trao đổi hoặc hẹn ngày phản hồi..." />
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('createQuoteModal')">Hủy</button>
            <button type="submit" class="btn btn-primary">Tạo yêu cầu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../store.js"></script>
  <script src="admin.js"></script>
  <script>
    let allQuotes = [];
    let filterState = {
      search: '',
      status: ''
    };

    function buildPage() {
      return `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon blue">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
            <div class="stat-info">
              <h3 id="statTotal">0</h3>
              <p>Tổng yêu cầu</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon orange">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <div class="stat-info">
              <h3 id="statPending">0</h3>
              <p>Chờ báo giá</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            </div>
            <div class="stat-info">
              <h3 id="statContacted">0</h3>
              <p>Đã liên hệ</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <div class="stat-info">
              <h3 id="statQuoted">0</h3>
              <p>Đã báo giá / Xong</p>
            </div>
          </div>
        </div>

        <div class="filter-toolbar">
          <div class="search-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchQuote" placeholder="Tìm theo mã RFQ, tên khách, số điện thoại hoặc linh kiện..." />
          </div>
          <select class="filter-select" id="filterStatus">
            <option value="">Tất cả trạng thái</option>
            <option value="pending">Chờ báo giá</option>
            <option value="contacted">Đã liên hệ</option>
            <option value="quoted">Đã báo giá</option>
            <option value="completed">Hoàn tất</option>
            <option value="cancelled">Đã hủy</option>
          </select>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">
              Danh sách yêu cầu báo giá
              <span class="badge badge-info" id="quoteCount" style="margin-left: 6px;">0</span>
            </div>
          </div>
          <div class="card-body no-padding">
            <div class="table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="width: 110px;">Mã YC</th>
                    <th style="width: 220px;">Khách hàng & SĐT</th>
                    <th>Nội dung linh kiện cần báo giá</th>
                    <th style="width: 140px;">Trạng thái</th>
                    <th style="width: 140px;">Thời gian gửi</th>
                    <th style="width: 110px;">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="quoteTableBody">
                  <tr><td colspan="6" class="text-center text-gray" style="padding: 30px;">Đang tải dữ liệu...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    (function init() {
      renderLayout('quotes', 'Quản lý yêu cầu báo giá', buildPage(), `
        <button class="btn btn-sm btn-primary" onclick="openCreateQuoteModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Tạo yêu cầu mới</span>
        </button>
      `);

      document.getElementById('searchQuote')?.addEventListener('input', (e) => {
        filterState.search = e.target.value.toLowerCase();
        renderTable();
      });

      document.getElementById('filterStatus')?.addEventListener('change', (e) => {
        filterState.status = e.target.value;
        renderTable();
      });

      renderAllAdmin = function () {
        allQuotes = getData('quotes', []);
        renderStats();
        renderTable();
      };

      renderAllAdmin();
    })();

    function renderStats() {
      const total = allQuotes.length;
      const pending = allQuotes.filter(q => q.status === 'pending').length;
      const contacted = allQuotes.filter(q => q.status === 'contacted').length;
      const quoted = allQuotes.filter(q => q.status === 'quoted' || q.status === 'completed').length;

      const setVal = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      };

      setVal('statTotal', total);
      setVal('statPending', pending);
      setVal('statContacted', contacted);
      setVal('statQuoted', quoted);
      setVal('quoteCount', total);
    }

    function renderTable() {
      const tbody = document.getElementById('quoteTableBody');
      if (!tbody) return;

      let filtered = allQuotes.filter((q) => {
        if (filterState.status && q.status !== filterState.status) return false;
        if (filterState.search) {
          const s = filterState.search;
          const matchId = String(q.id || '').toLowerCase().includes(s);
          const matchCust = String(q.customer || '').toLowerCase().includes(s);
          const matchPhone = String(q.phone || '').includes(s);
          const matchContent = String(q.content || '').toLowerCase().includes(s);
          const matchNotes = String(q.notes || '').toLowerCase().includes(s);
          if (!matchId && !matchCust && !matchPhone && !matchContent && !matchNotes) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="padding: 60px 20px; text-align: center; background: #fafcff;">
              <div style="width: 56px; height: 56px; margin: 0 auto 16px; background: #e0e7ff; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
              </div>
              <div style="font-size: 15px; font-weight: 600; color: #1e293b; margin-bottom: 6px;">
                ${filterState.search || filterState.status ? 'Không có yêu cầu báo giá phù hợp bộ lọc' : 'Chưa có yêu cầu báo giá nào'}
              </div>
              <p style="font-size: 13px; color: #64748b; max-width: 500px; margin: 0 auto 16px; line-height: 1.5;">
                ${filterState.search || filterState.status ? 'Thử xóa từ khóa tìm kiếm hoặc chọn "Tất cả trạng thái".' : 'Dữ liệu thực tế sẽ tự động hiển thị tại đây ngay khi khách hàng gửi thông tin từ form "Báo giá nhanh" trên trang chủ hoặc khi bạn tạo yêu cầu mới.'}
              </p>
              ${!filterState.search && !filterState.status ? `
                <button class="btn btn-sm btn-primary" onclick="openCreateQuoteModal()" style="display: inline-flex; align-items: center; gap: 6px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Tạo yêu cầu báo giá thực tế
                </button>
              ` : ''}
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map((q) => {
        const cleanPhone = String(q.phone || '').replace(/[^0-9]/g, '');
        const dateStr = q.createdAt ? new Date(q.createdAt).toLocaleString('vi-VN', {
          hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric'
        }) : '—';

        return `
          <tr>
            <td>
              <strong class="text-primary font-mono">${escapeHtml(q.id)}</strong>
            </td>
            <td>
              <div style="font-weight: 600; color: var(--text-dark);">${escapeHtml(q.customer)}</div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px;">
                <a href="tel:${cleanPhone}" style="color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 3px;" title="Gọi điện">
                  📞 ${escapeHtml(q.phone)}
                </a>
                ${cleanPhone ? `
                  <a href="https://zalo.me/${cleanPhone}" target="_blank" rel="noopener" class="badge badge-info" style="text-decoration: none; padding: 1px 6px; font-size: 11px;" title="Nhắn tin qua Zalo">
                    Zalo
                  </a>
                ` : ''}
              </div>
              ${q.email ? `<div class="text-xs text-gray" style="margin-top: 2px;">${escapeHtml(q.email)}</div>` : ''}
            </td>
            <td>
              <div style="font-size: 13px; line-height: 1.45; max-width: 420px; word-break: break-word;">
                ${escapeHtml(q.content)}
              </div>
              ${q.notes ? `
                <div class="text-xs text-gray" style="margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.03); padding: 2px 6px; border-radius: 4px;">
                  💬 <em>${escapeHtml(q.notes)}</em>
                </div>
              ` : ''}
            </td>
            <td>
              ${badge(q.status, 'quote')}
            </td>
            <td>
              <div class="text-xs">${dateStr}</div>
            </td>
            <td>
              <div class="table-actions">
                <button class="action-btn" onclick="openQuoteDetail('${q.id}')" title="Xem chi tiết & Xử lý">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button class="action-btn danger" onclick="handleDeleteQuote('${q.id}')" title="Xóa">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openQuoteDetail(id) {
      const q = allQuotes.find(item => item.id === id);
      if (!q) return;

      const cleanPhone = String(q.phone || '').replace(/[^0-9]/g, '');
      const dateStr = q.createdAt ? new Date(q.createdAt).toLocaleString('vi-VN') : '—';

      const contentEl = document.getElementById('quoteDetailContent');
      const footerEl = document.getElementById('quoteDetailFooter');

      contentEl.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
          <div>
            <h3 style="font-size: 18px; margin: 0 0 4px 0;">Yêu cầu ${escapeHtml(q.id)}</h3>
            <span class="text-xs text-gray">Nhận lúc: ${dateStr}</span>
          </div>
          <div>
            ${badge(q.status, 'quote')}
          </div>
        </div>

        <div class="form-row" style="margin-bottom: 16px;">
          <div class="form-group">
            <span class="text-xs text-gray">Khách hàng / Đơn vị</span>
            <div style="font-size: 15px; font-weight: 600; margin-top: 2px;">${escapeHtml(q.customer)}</div>
          </div>
          <div class="form-group">
            <span class="text-xs text-gray">Số điện thoại liên hệ</span>
            <div style="font-size: 15px; font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 8px;">
              <span>${escapeHtml(q.phone)}</span>
              <a href="tel:${cleanPhone}" class="btn btn-sm btn-secondary" style="padding: 2px 8px; font-size: 11px;">📞 Gọi ngay</a>
              ${cleanPhone ? `<a href="https://zalo.me/${cleanPhone}" target="_blank" rel="noopener" class="btn btn-sm btn-primary" style="padding: 2px 8px; font-size: 11px;">💬 Chat Zalo</a>` : ''}
            </div>
          </div>
        </div>

        ${q.email ? `
          <div class="form-group" style="margin-bottom: 16px;">
            <span class="text-xs text-gray">Email</span>
            <div style="font-size: 14px; margin-top: 2px;">
              <a href="mailto:${escapeHtml(q.email)}" style="color: var(--primary);">${escapeHtml(q.email)}</a>
            </div>
          </div>
        ` : ''}

        <div class="form-group" style="margin-bottom: 16px;">
          <label style="font-weight: 600; color: var(--text-dark); margin-bottom: 6px; display: block;">
            Danh sách linh kiện & Yêu cầu của khách:
          </label>
          <div style="background: var(--light, #f8fafc); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;">
${escapeHtml(q.content)}
          </div>
        </div>

        <div class="form-row" style="margin-top: 20px;">
          <div class="form-group">
            <label for="qdStatus" style="font-weight: 600;">Cập nhật trạng thái xử lý:</label>
            <select class="form-control" id="qdStatus">
              <option value="pending" ${q.status === 'pending' ? 'selected' : ''}>Chờ báo giá</option>
              <option value="contacted" ${q.status === 'contacted' ? 'selected' : ''}>Đã liên hệ trao đổi</option>
              <option value="quoted" ${q.status === 'quoted' ? 'selected' : ''}>Đã gửi báo giá</option>
              <option value="completed" ${q.status === 'completed' ? 'selected' : ''}>Hoàn tất / Khách đã chốt</option>
              <option value="cancelled" ${q.status === 'cancelled' ? 'selected' : ''}>Đã hủy yêu cầu</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label for="qdNotes" style="font-weight: 600;">Ghi chú nội bộ của Quản trị viên:</label>
          <textarea class="form-control" id="qdNotes" rows="2" placeholder="Nhập giá dự toán, thời gian giao hàng đã hẹn hoặc thỏa thuận với khách...">${escapeHtml(q.notes || '')}</textarea>
        </div>
      `;

      footerEl.innerHTML = `
        <button type="button" class="btn btn-secondary" onclick="closeModal('quoteDetailModal')">Đóng</button>
        <button type="button" class="btn btn-primary" onclick="saveQuoteDetail('${q.id}')">💾 Lưu cập nhật</button>
      `;

      openModal('quoteDetailModal');
    }

    function saveQuoteDetail(id) {
      const status = document.getElementById('qdStatus').value;
      const notes = document.getElementById('qdNotes').value.trim();

      const updated = updateStoreQuote(id, { status, notes });
      if (updated) {
        showToast('Đã cập nhật trạng thái yêu cầu ' + id, 'success');
        closeModal('quoteDetailModal');
        renderAllAdmin();
      } else {
        showToast('Không tìm thấy yêu cầu báo giá cần sửa', 'error');
      }
    }

    function handleDeleteQuote(id) {
      if (!confirmAction(`Bạn có chắc chắn muốn xóa yêu cầu báo giá ${id}?`)) return;
      deleteStoreQuote(id);
      showToast('Đã xóa yêu cầu báo giá ' + id, 'success');
      renderAllAdmin();
    }

    function openCreateQuoteModal() {
      document.getElementById('createQuoteForm').reset();
      openModal('createQuoteModal');
    }

    function handleAdminCreateQuote(e) {
      e.preventDefault();
      const customer = document.getElementById('cqCustomer').value.trim();
      const phone = document.getElementById('cqPhone').value.trim();
      const email = document.getElementById('cqEmail').value.trim();
      const status = document.getElementById('cqStatus').value;
      const content = document.getElementById('cqContent').value.trim();
      const notes = document.getElementById('cqNotes').value.trim();

      if (!customer || !phone || !content) {
        showToast('Vui lòng điền đầy đủ tên khách, số điện thoại và danh sách linh kiện', 'warning');
        return false;
      }

      const newQuote = addStoreQuote({ customer, phone, email, status, content, notes });
      closeModal('createQuoteModal');
      showToast('Đã tạo thành công yêu cầu báo giá ' + newQuote.id, 'success');
      renderAllAdmin();
      return false;
    }
  </script>
</body>

</html>
